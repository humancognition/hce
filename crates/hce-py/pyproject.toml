[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hce"
version = "0.1.2"
description = "Lossless, pronounceable, encrypted codec for any identifier — reversible, format-preserving, human-readable"
requires-python = ">=3.8"
license = {text = "MIT"}
readme = "README.md"
keywords = ["hce", "uuid", "identifier", "codec", "encryption", "pronounceable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Text Processing",
]
authors = [
    {name = "HCE contributors", email = "tmddn3070@users.noreply.github.com"},
]
urls = {repository = "https://github.com/humancognition/hce"}

[tool.maturin]
features = ["pyo3/extension-module"]
