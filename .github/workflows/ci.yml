name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude hce-py -- -D warnings

  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cbindgen --locked
      - run: cbindgen --config crates/hce-ffi/cbindgen.toml --crate hce-ffi --output /tmp/hce_gen.h
      - run: diff <(grep -v '^#define\|^$' crates/hce-ffi/hce.h) <(grep -v '^#define\|^$' /tmp/hce_gen.h)

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  build:
    needs: [lint, header]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --exclude hce-py

  test:
    needs: [lint, header]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --exclude hce-py
      - run: cargo test --test exhaustive -p hce-core
      - run: cargo run -p hce-cli -- kat shared/kat

  wasm:
    needs: [lint, header]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build --target web crates/hce-wasm
      - run: cp crates/hce-wasm/pkg/hce_wasm_bg.wasm bindings/npm/hce/index_bg.wasm
      - run: cp crates/hce-wasm/pkg/hce_wasm.js bindings/npm/hce/index.web.js
      - run: cp crates/hce-wasm/pkg/hce_wasm.d.ts bindings/npm/hce/index.web.d.ts
      - run: cp crates/hce-wasm/pkg/hce_wasm_bg.wasm.d.ts bindings/npm/hce/index_bg.wasm.d.ts
      - run: |
          cat > bindings/npm/hce/index.node.js << 'NODEEOF'
          import { readFileSync } from "fs";
          import { join, dirname } from "path";
          import { fileURLToPath } from "url";
          import { initSync, HceCodec } from "./index.web.js";
          const __filename = fileURLToPath(import.meta.url);
          const __dirname = dirname(__filename);
          initSync(readFileSync(join(__dirname, "index_bg.wasm")));
          export { HceCodec };
          NODEEOF
      - run: cd bindings/npm/hce && npm ci && npx vitest run

  python:
    needs: [lint, header]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install maturin pytest
      - run: cd crates/hce-py && maturin build
      - run: pip install $(python -c "import glob; print(glob.glob('target/wheels/hce-*.whl')[0])")
      - run: python crates/hce-py/tests/test_kat.py
      - run: python crates/hce-py/tests/test_api.py
      - run: python -m pytest crates/hce-py/tests/test_pytest.py -v

  go:
    needs: [lint, header]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: cargo build -p hce-ffi --release
      - run: cd bindings/go && CGO_LDFLAGS="-L$(pwd)/../../target/release -lhce_ffi" CGO_CFLAGS="-I$(pwd)/../../crates/hce-ffi" go test -v

  java:
    needs: [lint, header]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: cargo build -p hce-ffi --release
      - run: cd bindings/java && gradle test
